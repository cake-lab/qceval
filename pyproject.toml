[project]
name = "qceval"
version = "0.1.0"
description = "Quantum circuit evaluation and benchmarking library"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "Javier Vela", email = "javier.vela00@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "networkx>=3.0",
    "numpy>=2.0",
    "python-dotenv>=1.2.2",
    "qiskit>=1.2.4",
    "tabulate>=0.10.0",
]

[dependency-groups]
dev = [
    "disqco",
    "pytest>=9.1.1",
    "ruff>=0.15.8",
]

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "qceval"
module-root = "src"

[tool.uv.sources]
disqco = { git = "https://github.com/felix-burt/DISQCO.git" }

